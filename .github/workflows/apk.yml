name: APK Derle
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'native/**'
      - 'package.json'
      - 'assets/**'
      - '.github/workflows/apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Uygulama adresi
        run: |
          OWNER=$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')
          REPO="${GITHUB_REPOSITORY#*/}"
          URL="https://$OWNER.github.io/$REPO/"
          echo "Adres: $URL"
          node -e "const u=process.argv[1];require('fs').writeFileSync('capacitor.config.json',JSON.stringify({appId:'com.sinif.akilzeka',appName:'Akıl Zeka Sınıfı',webDir:'www',server:{url:u,allowNavigation:[new URL(u).host],errorPath:'offline.html'}}))" "$URL"
          mkdir -p www
          cat > www/offline.html <<EOF
          <!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bağlantı yok</title>
          <style>body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#120f1f;color:#f3f0ff;font:16px system-ui,sans-serif;text-align:center;padding:24px}button{background:#8b5cf6;color:#fff;border:0;border-radius:12px;padding:12px 20px;font-size:16px;font-weight:600;margin-top:16px}</style></head>
          <body><div><div style="font-size:54px">📡</div><h2>Uygulama açılamadı</h2><p>İnternet bağlantısını kontrol edin. İlk açılışta internet gerekir; sonrasında çevrimdışı da çalışır.</p><button onclick="location.href='$URL'">Yeniden dene</button></div></body></html>
          EOF
      - run: npm install
      - run: npx cap add android
      - run: npx @capacitor/assets generate --android --iconBackgroundColor '#8b5cf6' --iconBackgroundColorDark '#8b5cf6'
        continue-on-error: true
      - name: Dosya kaydetme eklentisi ve sabit imza
        run: |
          D=android/app/src/main/java/com/sinif/akilzeka
          cp "$D/MainActivity.java" /tmp/MainActivity.orig
          cp native/SaveFilePlugin.java native/MainActivity.java "$D/"
          mkdir -p ~/.android
          cp native/debug.keystore ~/.android/debug.keystore
      - run: npx cap sync android
      - name: APK derle
        run: |
          cd android
          chmod +x gradlew
          D=app/src/main/java/com/sinif/akilzeka
          ./gradlew assembleDebug || { echo "Eklenti derlenemedi, eklentisiz derleniyor"; rm "$D/SaveFilePlugin.java"; cp /tmp/MainActivity.orig "$D/MainActivity.java"; ./gradlew assembleDebug; }
      - uses: actions/upload-artifact@v4
        with:
          name: akil-zeka-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
