<!DOCTYPE html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Akıl Zeka Sınıfı</title>
<style>
:root{--bg:#f4f1fb;--c:#fff;--p:#6c4bd1;--t:#222;--m:#777;--g:#2e9e5b;--r:#d6453d}
@media(prefers-color-scheme:dark){:root{--bg:#17151f;--c:#242131;--t:#eee;--m:#9a98a8}}
*{box-sizing:border-box}body{margin:0;font:16px system-ui,sans-serif;background:var(--bg);color:var(--t);padding-bottom:40px}
header{background:var(--p);color:#fff;padding:calc(14px + max(env(safe-area-inset-top),24px)) 16px 14px;font-weight:700;font-size:18px}
main{padding:12px;max-width:760px;margin:auto}
.card{background:var(--c);border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 1px 3px #0002}
button{background:var(--p);color:#fff;border:0;border-radius:8px;padding:10px 14px;font-size:15px}
button.s{background:#8883;color:var(--t)}button.d{background:var(--r)}button.g{background:var(--g)}
input,textarea{width:100%;padding:10px;border-radius:8px;border:1px solid #8885;background:var(--c);color:var(--t);font-size:16px;margin:4px 0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.row>*{flex:1}.row>.f0{flex:0 0 auto}
nav{position:sticky;top:0;z-index:5;display:flex;overflow-x:auto;background:var(--c);border-bottom:1px solid #8883}
nav button{flex:0 0 auto;min-width:64px;background:none;color:var(--m);border-radius:0;padding:8px 6px;font-size:12px}nav button.on{color:var(--p);font-weight:700;border-bottom:3px solid var(--p)}
.big{font-size:22px}.pts{font-weight:700;color:var(--p)}small{color:var(--m)}label{display:block;padding:6px 0}label input{width:auto;margin-right:8px}
</style></head><body><header>🧠 Akıl Zeka Sınıfı</header><nav id=n></nav><main id=m></main>
<script>
const K='akilzeka_v1';let S;try{S=JSON.parse(localStorage.getItem(K))}catch(e){}
S=S||{st:[],att:{},notes:[],tn:null};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}},today=()=>new Date().toISOString().slice(0,10);
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const nm=id=>{const s=S.st.find(x=>x.id==id);return s?esc(s.n):'—'};
const gs=id=>S.st.find(x=>x.id==id);
let T='ogr',D=today(),R='';
const TABS=[['ogr','👥','Öğrenci'],['yok','✅','Yoklama'],['tur','🏆','Turnuva'],['pua','⭐','Puan'],['not','📝','Not'],['arc','🧰','Araçlar'],['yed','💾','Yedek']];
const go=t=>{T=t;R='';draw()};
function draw(){n.innerHTML=TABS.map(t=>`<button class="${T==t[0]?'on':''}" onclick="go('${t[0]}')">${t[1]}<br>${t[2]}</button>`).join('');m.innerHTML=V[T]()}
const pool=()=>{const a=S.att[D];const p=a?S.st.filter(s=>a[s.id]===1):[];return p.length?p:S.st};
const V={};
V.ogr=()=>`<div class=card><b>Öğrenci ekle</b> <small>(her satıra bir isim)</small><textarea id=nn rows=3></textarea><button onclick="addSt()">Ekle</button></div>`+S.st.map((s,i)=>`<div class="card row"><span class=f0>${i+1}.</span><span>${esc(s.n)}</span><button class="s f0" onclick="rep('${s.id}')">📊</button><button class="s f0" onclick="ren('${s.id}')">✏️</button><button class="d f0" onclick="del('${s.id}')">🗑</button></div>`).join('')+`<p>Toplam: ${S.st.length}</p>`;
function addSt(){nn.value.split('\n').map(x=>x.trim()).filter(Boolean).forEach(x=>S.st.push({id:uid(),n:x,p:0,a:0,k:[]}));save();draw()}
function rep(id){const s=gs(id),ab=Object.values(S.att).filter(x=>x[id]===0).length,pr=Object.values(S.att).filter(x=>x[id]===1).length;alert(s.n+'\nPuan: '+s.p+'  Artı: '+s.a+'\nKatıldığı ders: '+pr+'  Devamsızlık: '+ab+'\n\nNotlar:\n'+(s.k.map(k=>k.d+': '+k.t).join('\n')||'-'))}
function ren(id){const s=gs(id),v=prompt('Yeni isim',s.n);if(v&&v.trim()){s.n=v.trim();save();draw()}}
function del(id){if(confirm('Öğrenci silinsin mi?')){S.st=S.st.filter(s=>s.id!=id);save();draw()}}
V.yok=()=>{const a=S.att[D]||{};const c=S.st.filter(s=>a[s.id]===1).length;
return `<div class=card><input type=date value="${D}" onchange="D=this.value;draw()"><div class=row><button class=g onclick="allAtt(1)">Hepsi geldi</button><button class=s onclick="allAtt(0)">Temizle</button></div><p>Gelen: <b>${c}</b> / ${S.st.length}</p></div>`+S.st.map(s=>{const v=a[s.id],ab=Object.values(S.att).filter(x=>x[s.id]===0).length;return `<div class="card row"><span>${esc(s.n)}<br><small>devamsızlık: ${ab}</small></span><button class="${v===1?'g':'s'} f0" onclick="mark('${s.id}',1)">Var</button><button class="${v===0?'d':'s'} f0" onclick="mark('${s.id}',0)">Yok</button></div>`}).join('')};
const mark=(id,v)=>{(S.att[D]=S.att[D]||{})[id]=v;save();draw()};
const allAtt=v=>{if(!v)delete S.att[D];else{S.att[D]={};S.st.forEach(s=>S.att[D][s.id]=1)}save();draw()};
V.tur=()=>{const t=S.tn;let h=`<div class=card><b>🎲 Hızlı kura</b> <small>(yoklamada gelenler, yoksa herkes)</small><div class=row><button onclick="pick()">Rastgele öğrenci</button><button onclick="pairs()">Rastgele çiftler</button></div><div class=big style="margin-top:8px">${R}</div></div>`;
if(!t)return h+`<div class=card><b>🏆 Eleme turnuvası</b>`+pool().map(s=>`<label><input type=checkbox class=ck value="${s.id}" checked>${esc(s.n)}</label>`).join('')+`<label><input type=checkbox id=aw checked>Maç kazanana +1, şampiyona +5 puan ver</label><button onclick="startT()">Kura çek ve başlat</button></div>`;
h+=t.r.map((r,ri)=>`<div class=card><b>${ri+1}. Tur</b>`+r.map((x,mi)=>x.auto?`<p>${nm(x.a)} <small>— bay geçti</small></p>`:`<div class=row style="margin-top:6px"><button class="${x.w==x.a?'g':'s'}" onclick="win(${ri},${mi},'${x.a}')">${nm(x.a)}</button><span class=f0>⚔️</span><button class="${x.w==x.b?'g':'s'}" onclick="win(${ri},${mi},'${x.b}')">${nm(x.b)}</button></div>`).join('')+`</div>`).join('');
if(t.ch)h+=`<div class="card big">🏆 Şampiyon: <b>${nm(t.ch)}</b></div>`;
return h+`<button class=d onclick="S.tn=null;save();draw()">Turnuvayı kapat</button>`};
const mk=ids=>{const o=[];for(let i=0;i<ids.length;i+=2){const b=ids[i+1]||null;o.push({a:ids[i],b,w:b?null:ids[i],auto:!b})}return o};
function startT(){const ids=[...document.querySelectorAll('.ck:checked')].map(x=>x.value);if(ids.length<2)return alert('En az 2 kişi seçin');S.tn={r:[mk(shuf(ids))],aw:aw.checked,ch:null};save();draw()}
function win(ri,mi,id){const t=S.tn,r=t.r[ri],x=r[mi];if(x.w)return;x.w=id;if(t.aw)gs(id).p++;
if(ri==t.r.length-1&&r.every(y=>y.w)){const ws=r.map(y=>y.w);if(ws.length==1){t.ch=ws[0];if(t.aw)gs(ws[0]).p+=5}else t.r.push(mk(ws))}save();draw()}
function pick(){const p=pool();R=p.length?'🎯 '+esc(shuf(p)[0].n):'Öğrenci yok';draw()}
function pairs(){const p=shuf(pool());R=mk(p.map(s=>s.id)).map(x=>`${nm(x.a)} ⚔️ ${x.b?nm(x.b):'<small>bay</small>'}`).join('<br>');draw()}
V.pua=()=>[...S.st].sort((a,b)=>b.p-a.p||b.a-a.a).map((s,i)=>`<div class=card><div class=row><span class=f0>${i+1}.</span><span><b>${esc(s.n)}</b></span><span class="pts f0">${s.p} puan · ${s.a}➕</span></div><div class=row style="margin-top:6px"><button onclick="pp('${s.id}',1)">+1</button><button class=s onclick="pp('${s.id}',-1)">−1</button><button class=g onclick="pa('${s.id}')">➕ Artı</button><button class=s onclick="pk('${s.id}')">📝 Not</button></div>`+s.k.map((k,j)=>`<small style="display:block;margin-top:4px" onclick="dk('${s.id}',${j})">${k.d.slice(5)}: ${esc(k.t)}</small>`).join('')+`</div>`).join('')+(S.st.length?`<button class=d onclick="rp()">Tüm puanları sıfırla</button>`:'<p>Önce öğrenci ekleyin.</p>');
const pp=(id,v)=>{gs(id).p+=v;save();draw()},pa=id=>{gs(id).a++;save();draw()};
function pk(id){const v=prompt('Öğrenci notu');if(v&&v.trim()){gs(id).k.push({d:today(),t:v.trim()});save();draw()}}
function dk(id,j){if(confirm('Bu not silinsin mi?')){gs(id).k.splice(j,1);save();draw()}}
function rp(){if(confirm('Tüm puan ve artılar sıfırlansın mı?')){S.st.forEach(s=>{s.p=0;s.a=0});save();draw()}}
V.not=()=>`<div class=card><textarea id=gn rows=3 placeholder="Ders notu, fikir, oyun planı..."></textarea><button onclick="addN()">Not ekle</button></div>`+[...S.notes].reverse().map(x=>`<div class=card><small>${x.d}</small><div style="white-space:pre-wrap">${esc(x.t)}</div><button class="d" onclick="delN('${x.id}')">Sil</button></div>`).join('');
const addN=()=>{if(gn.value.trim()){S.notes.push({id:uid(),d:today(),t:gn.value.trim()});save();draw()}};
const delN=id=>{if(confirm('Silinsin mi?')){S.notes=S.notes.filter(x=>x.id!=id);save();draw()}};
let tm=0,ti=null;const fmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
V.arc=()=>`<div class=card><b>⏱ Geri sayım</b><div class=row><input id=mn type=number value=5 min=1><button onclick="tS()">Başlat</button><button class=s onclick="tX()">Durdur</button><button class=s onclick="tm=0;tX();draw()">Sıfırla</button></div><div id=td style="text-align:center;font-size:48px;font-weight:700">${fmt(tm)}</div></div><div class=card><b>👥 Takım kur</b> <small>(kişi sayısı = kaç takım)</small><input id=tk type=number value=2 min=2><button onclick="teams()">Takımları oluştur</button><div style="margin-top:8px">${R}</div></div>`;
function tX(){clearInterval(ti);ti=null}
function tS(){if(ti)return;if(!tm)tm=Math.max(1,+mn.value||1)*60;ti=setInterval(()=>{tm--;const e=document.getElementById('td');if(e)e.textContent=tm>0?fmt(tm):'⏰ Süre doldu!';if(tm<=0){tX();tm=0;try{navigator.vibrate([500,200,500,200,500])}catch(x){}}},1000)}
function teams(){const n=Math.max(2,+tk.value||2),g=Array.from({length:n},()=>[]);shuf(pool()).forEach((s,i)=>g[i%n].push(esc(s.n)));R=g.map((x,i)=>`<b>${i+1}. Takım:</b> ${x.join(', ')||'-'}`).join('<br>');draw()}
V.yed=()=>`<div class=card><b>💾 Yedekleme</b><p><small>Dosyayı Drive, WhatsApp veya Dosyalar'a kaydedin.</small></p><button onclick="backup()">Yedekle</button></div><div class=card><b>📊 Excel çıktısı</b><p><small>Puan, artı, devamsızlık ve notlar (CSV, Excel'de açılır)</small></p><button onclick="csv()">Excel'e aktar</button></div><div class=card><b>Geri yükle</b><input type=file accept=".json,application/json" onchange="restore(this)"></div>`;
async function saveF(f,j,mime){const C=window.Capacitor&&Capacitor.Plugins;
if(C&&C.Filesystem&&C.Share){try{const r=await C.Filesystem.writeFile({path:f,data:j,directory:'CACHE',encoding:'utf8'});await C.Share.share({title:f,url:r.uri});return}catch(e){alert('Hata: '+(e.message||e))}}
const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([j],{type:mime}));a.download=f;a.click()}
const backup=()=>saveF('akilzeka-yedek-'+today()+'.json',JSON.stringify(S),'application/json');
function csv(){const q=x=>'"'+String(x).replace(/"/g,'""')+'"';const rows=[['Ad','Puan','Artı','Katıldı','Devamsız','Notlar'].map(q).join(';')].concat(S.st.map(s=>{const A=Object.values(S.att);return [s.n,s.p,s.a,A.filter(x=>x[s.id]===1).length,A.filter(x=>x[s.id]===0).length,s.k.map(k=>k.d+': '+k.t).join(' | ')].map(q).join(';')}));saveF('akilzeka-liste-'+today()+'.csv','\ufeff'+rows.join('\n'),'text/csv')}
function restore(el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);if(!Array.isArray(o.st))throw 0;if(confirm('Mevcut veriler yedekle değiştirilsin mi?')){S=o;save();draw()}}catch(e){alert('Geçersiz yedek dosyası')}};r.readAsText(f)}
draw();
</script></body></html>
